<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Garajku — vehicle logbook</title>
<meta name="theme-color" content="#0F1418">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Garajku">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0F1418; --surface:#171E23; --surface2:#1E272D; --line:#2C383F;
  --text:#E6EDF0; --muted:#8A9BA4; --dim:#5E7078;
  --ok:#4FB286; --soon:#E0A33E; --over:#E0574C; --idle:#5E7078;
  --amber:#E0A33E;
  /* semantic aliases */
  --bg-amber:#1C170E; --bg-over:#1A0E0D; --bg-soon:#1C170E;
  --bg-code:#111A1F; --bg-chat-user:#1A2830;
  --border-amber:#5C4A1A; --border-over:#5C2A24; --border-soon:#5C4A1A;
  --avatar-bg:#1E2E36;
  --display:'Barlow Condensed',Impact,sans-serif;
  --body:'IBM Plex Sans',system-ui,-apple-system,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --r:14px; --pad:16px;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
button,a,.chip,.card.tap{touch-action:manipulation}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg); color:var(--text); font-family:var(--body);
  font-size:15px; line-height:1.45; overscroll-behavior-y:none;
  padding-bottom:calc(76px + var(--safe-b));
}
h1,h2,h3,.disp{font-family:var(--display);font-weight:600;letter-spacing:.02em;margin:0}
.mono{font-family:var(--mono)}
button,input,select,textarea{font-family:inherit;font-size:16px;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:var(--amber)}
::-webkit-scrollbar{width:0;height:0}

/* ---------- app chrome ---------- */
header.top{
  position:sticky;top:0;z-index:40;background:linear-gradient(180deg,var(--bg) 72%,transparent);
  padding:calc(10px + env(safe-area-inset-top,0px)) var(--pad) 10px;
  display:flex;align-items:flex-end;justify-content:space-between;gap:12px;
}
header.top .eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.22em;color:var(--dim);text-transform:uppercase}
header.top h1{font-size:30px;line-height:.95;text-transform:uppercase}
.wrap{padding:0 var(--pad) 24px;max-width:680px;margin:0 auto}

nav.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  display:grid;grid-template-columns:repeat(6,1fr);
  background:rgba(15,20,24,.94);backdrop-filter:blur(14px);
  border-top:1px solid var(--line);padding-bottom:var(--safe-b);
}
nav.tabs button{padding:9px 1px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--dim);font-size:9px;letter-spacing:.02em;text-transform:uppercase;font-family:var(--mono)}
nav.tabs button svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on{color:var(--amber)}
nav.tabs button::before{content:"";width:20px;height:2px;border-radius:2px;background:transparent;margin-bottom:2px}
nav.tabs button.on::before{background:var(--amber)}

/* ---------- odometer signature ---------- */
.odo{display:flex;align-items:baseline;gap:6px}
.odo .digits{display:inline-flex;gap:2px}
.odo .d{
  font-family:var(--mono);font-weight:600;font-size:23px;line-height:1;
  background:linear-gradient(180deg,#26333A,#131A1F);border:1px solid #38474F;
  border-radius:3px;padding:5px 4px 4px;min-width:19px;text-align:center;
  box-shadow:inset 0 -6px 8px -6px #000, inset 0 6px 8px -6px rgba(255,255,255,.14);
}
.odo .d.last{background:linear-gradient(180deg,#3A2E18,#1C170E);border-color:#5C4A26;color:var(--amber)}
.odo .unit{font-family:var(--mono);font-size:11px;color:var(--dim);letter-spacing:.16em}

/* ---------- cards ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px}
.card.tap:active{background:var(--surface2)}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.grow{flex:1;min-width:0}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.muted{color:var(--muted)}.dim{color:var(--dim)}
.small{font-size:12.5px}.tiny{font-size:11px}
.label{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
.sect{margin:22px 0 9px;display:flex;align-items:center;gap:10px}
.sect h2{font-size:15px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-family:var(--mono);font-weight:500}
.sect .rule{flex:1;height:1px;background:var(--line)}

/* gauge bar */
.gauge{height:5px;border-radius:99px;background:#222D33;overflow:hidden;margin-top:9px;position:relative}
.gauge i{display:block;height:100%;border-radius:99px;background:var(--c,var(--ok));transition:width .5s cubic-bezier(.2,.8,.2,1)}
.gauge.striped i{background-image:repeating-linear-gradient(115deg,rgba(0,0,0,.22) 0 5px,transparent 5px 10px)}

.pill{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:3px 7px;border-radius:99px;border:1px solid var(--c,var(--line));color:var(--c,var(--muted));white-space:nowrap}
.dot{width:7px;height:7px;border-radius:99px;background:var(--c,var(--idle));flex:none}
.st-ok{--c:var(--ok)}.st-soon{--c:var(--soon)}.st-over{--c:var(--over)}.st-idle{--c:var(--idle)}

.big{font-family:var(--display);font-size:27px;line-height:1}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:10px;padding:11px 14px;font-size:14px;font-weight:500;border:1px solid var(--line);background:var(--surface2);color:var(--text)}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--amber);color:#16120A;border-color:var(--amber);font-weight:600}
.btn.ghost{background:transparent}
.btn.dang{color:var(--over);border-color:#4A2A27;background:transparent}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:9px}
.btn.full{width:100%}
.btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fab{position:fixed;right:16px;bottom:calc(88px + var(--safe-b));z-index:45;width:54px;height:54px;border-radius:50%;background:var(--amber);color:#16120A;display:grid;place-items:center;box-shadow:0 8px 22px rgba(0,0,0,.5)}
.fab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round}

.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 0 4px;margin:0 calc(var(--pad)*-1);padding-left:var(--pad);padding-right:var(--pad)}
.chip{flex:none;padding:7px 13px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:13px;color:var(--muted);white-space:nowrap}
.chip.on{background:var(--text);color:#0F1418;border-color:var(--text);font-weight:600}

/* forms + sheet */
.scrim{position:fixed;inset:0;background:rgba(6,9,11,.72);z-index:60;opacity:0;pointer-events:none;transition:opacity .22s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;background:var(--surface);border-radius:20px 20px 0 0;border-top:1px solid var(--line);
  max-height:92vh;overflow:auto;transform:translateY(102%);transition:transform .28s cubic-bezier(.2,.9,.25,1);
  padding:8px var(--pad) calc(20px + var(--safe-b));max-width:680px;margin:0 auto}
.sheet.on{transform:translateY(0)}
.grab{width:38px;height:4px;border-radius:9px;background:var(--line);margin:6px auto 12px}
.sheet h3{font-size:21px;text-transform:uppercase;margin-bottom:2px}
.f{margin-bottom:12px}
.f label{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin-bottom:5px}
.f input,.f select,.f textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;outline:none}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--amber)}
.f textarea{min-height:74px;resize:vertical}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{font-size:11.5px;color:var(--dim);margin-top:5px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:80px;padding:9px;border-radius:9px;border:1px solid var(--line);background:var(--bg);font-size:13px;color:var(--muted)}
.seg button.on{border-color:var(--amber);color:var(--amber);background:var(--bg-amber)}

.empty{text-align:center;padding:34px 16px;border:1px dashed var(--line);border-radius:var(--r);color:var(--muted)}
.empty .big{color:var(--text);margin-bottom:6px}
.toast{position:fixed;left:50%;transform:translateX(-50%) translateY(24px);bottom:calc(96px + var(--safe-b));z-index:80;background:var(--text);color:#0F1418;padding:10px 16px;border-radius:99px;font-size:13.5px;font-weight:600;opacity:0;transition:.25s;pointer-events:none;max-width:88vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.thumbs{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}
.thumbs img{width:62px;height:62px;object-fit:cover;border-radius:9px;border:1px solid var(--line)}
.vpic{background:linear-gradient(160deg,#202B31,#151C21);background-size:cover;background-position:center;
  border:1px solid var(--line);border-radius:11px;display:grid;place-items:center;flex:none;overflow:hidden;position:relative}
.vpic.sm{width:64px;height:64px}
.vpic.lg{width:100%;height:168px;border-radius:12px;margin-bottom:12px;align-items:end;justify-items:start}
.vpic svg{width:56%;height:56%;stroke:#3E525C;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.vpic.lg svg{width:104px;height:104px}
.vpic.has svg{display:none}
.vpic.lg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 42%,rgba(10,14,17,.86))}
.vpic.lg .ov{position:relative;z-index:2;padding:12px;display:flex;align-items:center;gap:9px}
.vpic .cam{position:absolute;z-index:3;right:8px;top:8px;background:rgba(12,16,19,.72);border:1px solid var(--line);
  border-radius:8px;padding:5px 8px;font-size:11px;color:var(--text);font-family:var(--mono);letter-spacing:.08em}
/* ---------- drive mode ---------- */
body.noscroll{overflow:hidden}
.drive{position:fixed;inset:0;z-index:70;background:radial-gradient(130% 90% at 50% 0%,#17222A 0%,#0B0F12 62%);
  display:none;flex-direction:column;padding:calc(10px + env(safe-area-inset-top,0px)) 18px calc(16px + env(safe-area-inset-bottom,0px));
  overflow-y:auto;-webkit-overflow-scrolling:touch}
.drive.on{display:flex}
.drive #driveBody{display:flex;flex-direction:column;flex:1;max-width:520px;margin:0 auto;width:100%}
.dvtop{display:flex;align-items:center;gap:10px;flex:none}
.dvx{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);color:var(--muted);font-size:15px;flex:none}
.dvveh{font-family:var(--display);font-size:19px;text-transform:uppercase;letter-spacing:.04em;flex:1;text-align:center}
.dvstat{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--dim);flex:none;max-width:40%;text-align:right;line-height:1.3}
.dial{position:relative;width:min(74vw,282px);aspect-ratio:1;margin:14px auto 6px;flex:none}
.dial svg{width:100%;height:100%;transform:rotate(135deg)}
.dial .trk{fill:none;stroke:#1C262C;stroke-width:13;stroke-linecap:round;
  stroke-dasharray:540;stroke-dashoffset:135}
.dial .val{fill:none;stroke:var(--amber);stroke-width:13;stroke-linecap:round;
  transition:stroke-dashoffset .35s cubic-bezier(.2,.8,.2,1)}
.dial.over .val{stroke:var(--over)}
.dial.over .dsp{color:var(--over)}
.dnum{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.dsp{font-family:var(--mono);font-weight:600;font-size:clamp(56px,19vw,86px);line-height:.9;
  font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.dunit{font-family:var(--mono);font-size:11px;letter-spacing:.3em;color:var(--dim);margin-top:7px}
.dstats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center;
  padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);flex:none}
.dstats .big{font-size:23px;margin-top:3px}
.dstats .u{font-size:11px;color:var(--dim);margin-left:3px;font-family:var(--mono)}
.dvpick{padding:16px 0;flex:1}
.dvact{flex:none;padding-top:12px}
@media (max-height:680px){.dial{width:min(52vw,210px);margin:8px auto 2px}.dsp{font-size:clamp(44px,14vw,64px)}}

/* ---------- tyre tracker ---------- */
.tyrediag{display:grid;gap:8px;margin-bottom:10px}
.tyrediag.car{grid-template-columns:1fr 1fr;grid-template-rows:auto auto}
.tyrediag.moto{grid-template-columns:1fr;max-width:200px;margin:0 auto 10px}
.tyreslot{background:var(--surface);border:2px solid var(--line);border-radius:14px;
  padding:13px 10px;text-align:center;cursor:pointer;min-height:82px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.tyreslot.empty{border-style:dashed;opacity:.55}
.tyreslot.st-ok{border-color:#2A4A37}
.tyreslot.st-soon{border-color:#5C4A1A}
.tyreslot.st-over{border-color:#5C2A24;background:var(--bg-over)}
.tyrepos{font-family:var(--mono);font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
.tyrepsi{font-size:22px;font-family:var(--mono);font-weight:600;line-height:1}
.tyretgt{font-size:10px}
.tyretread{font-size:10px;font-family:var(--mono);padding:2px 6px;border-radius:99px;margin-top:2px}
.tyretread.st-soon{background:var(--bg-soon);color:var(--soon)}
.tyretread.st-over{background:var(--bg-over);color:var(--over)}

/* ---------- chat surface ---------- */
#view.chat{display:flex;flex-direction:column;padding-bottom:0;
  height:calc(100vh - 148px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));
  height:calc(100dvh - 148px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
.chatbar{flex:none;padding-bottom:6px;border-bottom:1px solid var(--line);margin-bottom:4px}
.thread{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px 0 4px;scroll-behavior:smooth;overscroll-behavior:contain}
.msg{margin-bottom:16px;animation:fade .25s ease both}
.msg.user{display:flex;justify-content:flex-end}
.ubub{max-width:85%;background:var(--bg-chat-user);border:1px solid #35464F;border-radius:15px 15px 4px 15px;
  padding:10px 13px;font-size:14.5px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.uatt{display:flex;gap:5px;margin-bottom:7px}
.uatt span{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;
  border:1px solid #4A5D67;border-radius:99px;padding:2px 7px;color:var(--muted)}
.msg.bot .who{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:10px;
  letter-spacing:.2em;text-transform:uppercase;color:var(--dim);margin-bottom:7px}
.avatar{width:19px;height:19px;border-radius:6px;background:var(--avatar-bg);border:1px solid var(--border-amber);display:grid;place-items:center}
.avatar svg{width:12px;height:12px;stroke:var(--amber);fill:none;stroke-width:1.9}
.msg.bot .body{font-size:15px;line-height:1.62}
.msg.bot .body p{margin:0 0 11px}
.msg.bot .body p:last-child{margin-bottom:0}
.msg.bot .body h4{font-family:var(--display);font-size:17px;text-transform:uppercase;letter-spacing:.05em;margin:16px 0 7px;color:var(--text)}
.msg.bot .body ul,.msg.bot .body ol{margin:0 0 11px;padding-left:20px}
.msg.bot .body li{margin-bottom:6px}
.msg.bot .body li::marker{color:var(--amber)}
.msg.bot .body strong{color:var(--amber);font-weight:600}
.msg.bot .body em{color:var(--muted);font-style:italic}
.msg.bot .body code{font-family:var(--mono);font-size:13px;background:var(--bg-code);border:1px solid var(--line);padding:1px 5px;border-radius:5px}
.msg.bot .body pre{font-family:var(--mono);font-size:12.5px;background:var(--bg-code);border:1px solid var(--line);
  padding:11px;border-radius:10px;overflow-x:auto;white-space:pre;margin:0 0 11px}
.acts{display:flex;gap:14px;margin-top:11px;opacity:.72}
.acts button{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.acts button:active{color:var(--amber)}
.caret{display:inline-block;width:8px;height:15px;background:var(--amber);margin-left:2px;vertical-align:-2px;animation:blink .9s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.dots{display:inline-flex;gap:5px;padding:4px 0}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--dim);animation:bob 1.1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes bob{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-4px)}}
.welcome{text-align:center;padding:26px 4px 8px}
.wicon{width:46px;height:46px;border-radius:14px;background:var(--avatar-bg);border:1px solid var(--border-amber);display:grid;place-items:center;margin:0 auto 13px}
.wicon svg{width:24px;height:24px;stroke:var(--amber);fill:none;stroke-width:1.7}
.welcome h2{font-size:23px;text-transform:uppercase;margin-bottom:7px}
.welcome p{max-width:330px;margin:0 auto}
.sugg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px;text-align:left}
.sugg button{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px;display:flex;flex-direction:column;gap:3px}
.sugg button:active{background:var(--surface2)}
.sugg b{font-size:13px;font-weight:500;line-height:1.3}
.sugg span{font-size:11px;color:var(--dim);line-height:1.35}
.composer{flex:none;padding:9px 0 2px;background:var(--bg);border-top:1px solid var(--line)}
.inputline{display:flex;align-items:flex-end;gap:6px}
.composer textarea{flex:1;min-height:44px;max-height:132px;background:var(--surface);border:1px solid var(--line);
  border-radius:14px;padding:12px 13px;resize:none;outline:none;font-size:16px;line-height:1.35}
.composer textarea:focus{border-color:#48606C}
.iconbtn{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--surface);
  display:grid;place-items:center;flex:none;margin-bottom:3px}
.iconbtn svg{width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.iconbtn:active{background:var(--surface2)}
.iconbtn.rec{border-color:var(--over);background:var(--bg-over)}
.iconbtn.rec svg{stroke:var(--over)}
.sendbtn{width:44px;height:44px;border-radius:14px;background:var(--amber);display:grid;place-items:center;flex:none}
.sendbtn svg{width:20px;height:20px;stroke:#16120A;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.sendbtn.stop{background:var(--surface2);border:1px solid var(--line)}
.sendbtn.stop svg{stroke:var(--text);fill:var(--text)}
.attrow{display:flex;gap:7px;margin-bottom:8px;flex-wrap:wrap}
.att{position:relative;width:58px;height:58px;border-radius:11px;border:1px solid var(--line);background:var(--surface2);
  display:grid;place-items:center;overflow:hidden;cursor:pointer;text-align:center}
.att img{width:100%;height:100%;object-fit:cover}
.att .attk{font-family:var(--mono);font-size:8.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);line-height:1.5}
.att .x{position:absolute;top:-2px;right:4px;color:#fff;font-size:16px;text-shadow:0 1px 4px #000}
.recbar{display:flex;align-items:center;gap:9px;padding:9px 11px;border:1px solid var(--over);border-radius:12px;margin-bottom:8px;font-size:13px}

<script>
/* ============================================================
   SERVIS — local-first vehicle service logbook
   Storage: window.storage (Claude preview) -> localStorage fallback
   ============================================================ */
const KEY='servis:db:v1';
const store={
  async get(k){ try{ if(window.storage){const r=await window.storage.get(k,false);return r?r.value:null;} return localStorage.getItem(k);}catch(e){ try{return localStorage.getItem(k)}catch(_){return null} } },
  async set(k,v){ try{ if(window.storage){await window.storage.set(k,v,false);return true;} localStorage.setItem(k,v);return true;}catch(e){ try{localStorage.setItem(k,v);return true}catch(_){ toast('Storage full — remove some photos'); return false} } },
};
const uid=()=>Math.random().toString(36).slice(2,10);
const today=()=>new Date().toISOString().slice(0,10);
const D=s=>s?new Date(s+'T00:00:00'):null;
const daysBetween=(a,b)=>Math.round((b-a)/864e5);
const addMonths=(iso,m)=>{const d=D(iso);d.setMonth(d.getMonth()+Number(m||0));return d.toISOString().slice(0,10)};
const money=n=>(DB.settings.currency||'RM')+' '+Number(n||0).toLocaleString('en-MY',{minimumFractionDigits:0,maximumFractionDigits:2});
const km=n=>Number(n||0).toLocaleString('en-MY')+' km';
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate=iso=>{if(!iso)return '—';const d=D(iso);return d.toLocaleDateString('en-MY',{day:'2-digit',month:'short',year:'numeric'})};

  return [

    P('Tyres 185/55 R16','wear',50000,72,1200,0,'Price is a fitted set of 4'),

    P('12 V battery','wear',0,48,320,20,'e:HEV uses a smaller aux battery'),

function seedDB(){
  const v1={id:uid(),name:'SR GT 200',type:'moto',make:'Aprilia',model:'SR GT 200',year:2025,plate:'',odo:0,odoDate:today(),avgKmDay:25,tyrePsi:29,notes:'Run-in service due at 1,000 km.'};
  const v2={id:uid(),name:'City Hatchback',type:'car',make:'Honda',model:'City Hatchback RS',year:2026,plate:'',odo:0,odoDate:today(),avgKmDay:45,tyrePsi:33,notes:''};
  return {
    v:1, vehicles:[v1,v2],
    items:[...seedAprilia(v1.id),...seedCity(v2.id)],
    logs:[], odoLog:[], mods:[],
    docs:[
      {id:uid(),vehicleId:v1.id,kind:'Road tax',expiry:addMonths(today(),12),cost:2,provider:'JPJ',remindDays:30,notes:''},
      {id:uid(),vehicleId:v1.id,kind:'Insurance',expiry:addMonths(today(),12),cost:280,provider:'',remindDays:30,notes:''},
      {id:uid(),vehicleId:v2.id,kind:'Road tax',expiry:addMonths(today(),12),cost:90,provider:'JPJ',remindDays:30,notes:''},
      {id:uid(),vehicleId:v2.id,kind:'Insurance',expiry:addMonths(today(),12),cost:1400,provider:'',remindDays:30,notes:''},
    ],
    settings:{currency:'RM',soonDays:30,soonKm:500,ai:{provider:'builtin',keys:{},models:{},baseUrl:''},firstRun:1}
  };
}

let DB=null, VIEW='due', FILTER='all', MFILTER='all', dirty=false, BT_CONNECTED=false, BT_DEVICE_NAME='';
let _pkgCache={}, _dueCache=null, _dueTick=0, _rateCache={};
async function load(){
  const raw=await store.get(KEY);
  if(raw){ try{DB=JSON.parse(raw)}catch(e){DB=seedDB()} } else DB=seedDB();
  DB.settings=Object.assign({currency:'RM',soonDays:30,soonKm:500,ai:{provider:'builtin',keys:{},models:{},baseUrl:''}},DB.settings||{});
  const arr=x=>Array.isArray(x)?x:[];
  DB.vehicles=arr(DB.vehicles);DB.items=arr(DB.items);DB.mods=arr(DB.mods);
  DB.docs=arr(DB.docs);DB.logs=arr(DB.logs);DB.odoLog=arr(DB.odoLog);DB.chat=arr(DB.chat);DB.trips=arr(DB.trips);DB.tyres=arr(DB.tyres);
  const a=DB.settings.ai||{};
  if(!a.keys){
    DB.settings.ai={provider:(a.provider==='gemini'?'gemini':'builtin'),keys:{gemini:a.geminiKey||''},models:{},baseUrl:''};
  }
}
let saveT=null;
function save(){ Object.keys(_pkgCache).forEach(k=>delete _pkgCache[k]); Object.keys(_rateCache).forEach(k=>delete _rateCache[k]); invalidateDue(); clearTimeout(saveT); saveT=setTimeout(()=>store.set(KEY,JSON.stringify(DB)),300); }
function saveSoon(){ save() }   // alias — callers that used to call save() immediately
// UI actions that need the data flushed before a reload can call saveNow()
async function saveNow(){ clearTimeout(saveT); await store.set(KEY,JSON.stringify(DB)); }
function copyText(t,label){
  const done=()=>toast((label||'Copied')+' copied');
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done).catch(()=>fallback())}
  else fallback();
  function fallback(){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();
    try{document.execCommand('copy');done()}catch(e){toast(t)}document.body.removeChild(a)}
}
window.copyText=copyText;
function copyField(vid,field,label){const v=vehicleOf(vid);if(v&&v[field])copyText(String(v[field]),label)}
window.copyField=copyField;
function copyMsg(id){const m=(DB.chat||[]).find(x=>x.id===id);if(m)copyText(m.text,'Answer')}
window.copyMsg=copyMsg;
const IOS=/iPad|iPhone|iPod/.test(navigator.userAgent||'')||((navigator.platform==='MacIntel')&&navigator.maxTouchPoints>1);
const STANDALONE=!!(navigator.standalone||(window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches));
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('on');clearTimeout(t._x);t._x=setTimeout(()=>t.classList.remove('on'),2100)}

/* ---------- photos (separate keys so the main record stays small) ---------- */
async function savePhoto(dataUrl){const id='photo:'+uid();await store.set(id,dataUrl);return id}
async function getPhoto(id){return await store.get(id)}
function pickPhoto(cb){
  const i=document.createElement('input');i.type='file';i.accept='image/*';
  i.onchange=()=>{const f=i.files[0];if(!f)return;const r=new FileReader();
    r.onload=()=>{const img=new Image();img.onload=()=>{
      const max=1000,s=Math.min(1,max/Math.max(img.width,img.height));
      const c=document.createElement('canvas');c.width=img.width*s;c.height=img.height*s;
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      cb(c.toDataURL('image/jpeg',.62));
    };img.src=r.result};
    r.readAsDataURL(f)};
  i.click();
}

/* ---------- vehicle portrait ---------- */
const VEH_ICON={
  car:'<path d="M4 17h16M6.5 17v2M17.5 17v2"/><path d="M3.6 13.5 5.4 8.2A2.4 2.4 0 0 1 7.7 6.6h8.6a2.4 2.4 0 0 1 2.3 1.6l1.8 5.3"/><rect x="2.6" y="13.2" width="18.8" height="4.1" rx="1.4"/><path d="M6 15.4h1.6M16.4 15.4H18"/><path d="M8.4 6.8 8 13.2M15.6 6.8l.4 6.4"/>',
  moto:'<circle cx="5.4" cy="16.6" r="3.3"/><circle cx="18.6" cy="16.6" r="3.3"/><path d="M5.4 16.6h4.2l4-6.6h4.2"/><path d="M9.6 16.6 13 8.4h3.4"/><path d="M12.2 6.4h3.1l1.5 3.6"/><path d="M8.2 8.6h4.4"/>'
};
const PHOTO_CACHE={};
function vpic(v,size){
  const cls=size==='lg'?'vpic lg':'vpic sm';
  const inner=size==='lg'?`<div class="ov">${v.plate?`<span class="plate">${esc(v.plate)}</span>`:''}</div><button class="cam" onclick="event.stopPropagation();setVehiclePhoto('${v.id}')">${v.photoId?'CHANGE':'ADD PHOTO'}</button>`:'';
  return `<div class="${cls}${v.photoId&&PHOTO_CACHE[v.photoId]?' has':''}" data-photo="${v.photoId||''}"
    style="${v.photoId&&PHOTO_CACHE[v.photoId]?`background-image:url(${PHOTO_CACHE[v.photoId]})`:''}">
    <svg viewBox="0 0 24 24">${VEH_ICON[v.type==='moto'?'moto':'car']}</svg>${inner}</div>`;
}
async function hydratePhotos(){
  if(!document.querySelectorAll)return;
  const nodes=[...document.querySelectorAll('.vpic[data-photo]')].filter(n=>n.dataset.photo&&!n.classList.contains('has'));
  for(const n of nodes){
    const id=n.dataset.photo;
    if(!PHOTO_CACHE[id]){try{PHOTO_CACHE[id]=await getPhoto(id)}catch(e){continue}}
    if(PHOTO_CACHE[id]){n.style.backgroundImage=`url(${PHOTO_CACHE[id]})`;n.classList.add('has')}
  }
}
function setVehiclePhoto(vid){
  pickPhoto(async du=>{
    const v=vehicleOf(vid);
    const id=await savePhoto(du);
    PHOTO_CACHE[id]=du; v.photoId=id; save(); render(); toast('Photo added');
  });
}
window.setVehiclePhoto=setVehiclePhoto;

/* ---------- the reminder engine ---------- */
function vehicleOf(id){return DB.vehicles.find(v=>v.id===id)}
function avgKmDay(v){
  if(_rateCache[v.id]&&_rateCache[v.id].odo===v.odo)return _rateCache[v.id].rate;
  // real trips are the best evidence of how much this vehicle actually gets used
  const tr=(DB.trips||[]).filter(t=>t.vehicleId===v.id);
  if(tr.length>=3){
    const ts=tr.map(t=>t.ts).sort((a,b)=>a-b);
    const span=(ts[ts.length-1]-ts[0])/864e5;
    const total=tr.reduce((s,t)=>s+Number(t.km||0),0);
    if(span>=3&&total>0){const rate=Math.max(1,total/span);_rateCache[v.id]={odo:v.odo,rate};return rate;}
  }
  const logs=Q.odoLog(v.id).sort((a,b)=>a.date<b.date?-1:1);
  if(logs.length>=2){
    const a=logs[0],b=logs[logs.length-1];
    const d=daysBetween(D(a.date),D(b.date));
    if(d>=3 && b.odo>a.odo){const rate=Math.max(1,(b.odo-a.odo)/d);_rateCache[v.id]={odo:v.odo,rate};return rate;}
  }
  const rate=Math.max(1,Number(v.avgKmDay)||20);
  _rateCache[v.id]={odo:v.odo,rate};
  return rate;
}
/* status for one maintenance item */
function statusOf(item,v){
  const rate=avgKmDay(v), now=new Date(); now.setHours(0,0,0,0);
  const out={item,vehicle:v,rate};
  let dKm=null,dDays=null;
  if(item.everyKm>0){
    const nextKm=Number(item.lastKm||0)+Number(item.everyKm);
    out.nextKm=nextKm; dKm=nextKm-Number(v.odo||0);
    out.kmLeft=dKm; out.daysFromKm=dKm/rate;
  }
  if(item.everyMonths>0 && item.lastDate){
    const nd=addMonths(item.lastDate,item.everyMonths);
    out.nextDate=nd; dDays=daysBetween(now,D(nd)); out.daysFromDate=dDays;
  }
  const cands=[out.daysFromKm,out.daysFromDate].filter(x=>x!=null&&!isNaN(x));
  out.days = cands.length?Math.min(...cands):null;
  out.driver = (out.daysFromKm!=null && out.days===out.daysFromKm)?'km':'date';
  const S=DB.settings;
  if(out.days==null) out.state='idle';
  else if(out.days<=0 || (out.kmLeft!=null&&out.kmLeft<=0)) out.state='over';
  else if(out.days<=S.soonDays || (out.kmLeft!=null&&out.kmLeft<=S.soonKm)) out.state='soon';
  else out.state='ok';
  /* progress through the interval, 0..1 */
  let p=0;
  if(item.everyKm>0){ p=Math.max(p,(Number(v.odo||0)-Number(item.lastKm||0))/item.everyKm); }
  if(item.everyMonths>0&&item.lastDate){ const tot=daysBetween(D(item.lastDate),D(addMonths(item.lastDate,item.everyMonths)))||1; p=Math.max(p,daysBetween(D(item.lastDate),now)/tot); }
  out.pct=Math.max(0,Math.min(1.15,p));
  out.cost=Number(item.partsCost||0)+Number(item.labourCost||0);
  out.dueDate = out.nextDate || (out.daysFromKm!=null? new Date(Date.now()+out.daysFromKm*864e5).toISOString().slice(0,10):null);
  return out;
}
function invalidateDue(){_dueCache=null}
function allDue(){
  const tick=DB.vehicles.length+DB.items.length+(DB.vehicles[0]&&DB.vehicles[0].odo||0);
  if(_dueCache&&_dueTick===tick)return _dueCache;
  const list=[];
  DB.vehicles.forEach(v=>Q.items(v.id).forEach(i=>list.push(statusOf(i,v))));
  _dueCache=list.sort((a,b)=>(a.days==null?1e9:a.days)-(b.days==null?1e9:b.days));
  _dueTick=tick;
  return _dueCache;
}
function docStatus(d){
  const now=new Date();now.setHours(0,0,0,0);
  const days=d.expiry?daysBetween(now,D(d.expiry)):null;
  const state=days==null?'idle':days<0?'over':days<=(d.remindDays||30)?'soon':'ok';
  return {days,state};
}
const stateLabel={over:'Overdue',soon:'Due soon',ok:'On track',idle:'No schedule'};
function relDays(n){
  if(n==null)return '—';
  n=Math.round(n);
  if(n<0)return Math.abs(n)+ (Math.abs(n)===1?' day late':' days late');
  if(n===0)return 'Today';
  if(n<45)return 'in '+n+' days';
  if(n<400)return 'in '+Math.round(n/30)+' months';
  return 'in '+(n/365).toFixed(1)+' years';
}


/* ============================ CONSTANTS & HELPERS ============================ */
const STATE_COLOUR={over:'--over',soon:'--soon',ok:'--ok',idle:'--idle'};
function stateColour(state){return 'var('+STATE_COLOUR[state]+')';}
function stateDot(state){return `<span class="dot" style="background:var(${STATE_COLOUR[state]||'--idle'})"></span>`;}
/* ============================ DB QUERY LAYER ============================ */
// All DB reads go through these — no more scattered .filter() across views
const Q = {
  vehicles: ()=>DB.vehicles,
  vehicle:  id=>DB.vehicles.find(v=>v.id===id),
  items:    (vid,activeOnly=true)=>DB.items.filter(i=>i.vehicleId===vid&&(!activeOnly||i.active!==0)),
  logs:     vid=>DB.logs.filter(l=>l.vehicleId===vid),
  docs:     vid=>DB.docs.filter(d=>d.vehicleId===vid),
  mods:     vid=>DB.mods.filter(m=>m.vehicleId===vid),
  tyres:    vid=>(DB.tyres||[]).filter(t=>t.vehicleId===vid),
  trips:    vid=>(DB.trips||[]).filter(t=>t.vehicleId===vid),
  odoLog:   vid=>DB.odoLog.filter(o=>o.vehicleId===vid),
  chat:     vid=>(DB.chat||[]).filter(m=>m.vehicleId===vid),
  // aggregates
  totalSpent: vid=>Q.logs(vid).reduce((s,l)=>s+logTotal(l),0),
  lastTrips:  (vid,n=5)=>Q.trips(vid).sort((a,b)=>b.ts-a.ts).slice(0,n),
};
// vehicleOf kept for backward compat — delegates to Q.vehicle
function vehicleOf(id){return Q.vehicle(id)}

/* form builder: fields = [{k,label,type,opts,ph,hint,half,val}] */
function form(title,fields,onSave,extra){
  const F=fields.map(f=>{
    const v=f.val==null?'':f.val, id='f_'+f.k;
    let inp;
    if(f.type==='select') inp=`<select id="${id}">${f.opts.map(o=>{const[val,lab]=Array.isArray(o)?o:[o,o];return `<option value="${esc(val)}" ${String(val)===String(v)?'selected':''}>${esc(lab)}</option>`}).join('')}</select>`;
    else if(f.type==='textarea') inp=`<textarea id="${id}" placeholder="${esc(f.ph||'')}">${esc(v)}</textarea>`;
    else inp=`<input id="${id}" type="${f.type||'text'}" inputmode="${f.type==='number'?'decimal':'text'}" value="${esc(v)}" placeholder="${esc(f.ph||'')}">`;
    return `<div class="f ${f.half?'h':''}"><label for="${id}">${esc(f.label)}</label>${inp}${f.hint?`<div class="hint">${f.hint}</div>`:''}</div>`;
  });
  /* pair up halves */
  let out='',buf=[];
  fields.forEach((f,i)=>{ if(f.half){buf.push(F[i]); if(buf.length===2){out+=`<div class="f2">${buf.join('')}</div>`;buf=[]}} else {if(buf.length){out+=buf.join('');buf=[]} out+=F[i]} });
  if(buf.length)out+=buf.join('');
  sheet(`<h3>${esc(title)}</h3>${extra||''}${out}
    <div class="row" style="gap:8px;margin-top:6px">
      <button class="btn ghost grow" onclick="closeSheet()">Cancel</button>
      <button class="btn pri grow" id="sheetSave">Save</button>
    </div>`);
  const sb=document.getElementById('sheetSave');
  let done=false;
  sb.onclick=()=>{
    if(done)return; done=true; sb.disabled=true;
    const d={};fields.forEach(f=>{const e=document.getElementById('f_'+f.k);if(!e)return;let v=e.value;if(f.type==='number')v=v===''?0:Number(v);d[f.k]=v});
    try{onSave(d)}catch(err){done=false;sb.disabled=false;toast('Could not save');return}
    save();closeSheet();render();
  };
}
function confirmDo(msg,fn){

function odoStrip(n){

function packageOf(v,kind){
  const key=v.id+':'+kind+':'+v.odo+':'+DB.items.length;
  if(_pkgCache[key])return _pkgCache[key];
  const all=Q.items(v.id);
  const minorItems=all.filter(i=>i.category==='minor');
  const base=Math.min(...minorItems.filter(i=>i.everyKm>0).map(i=>i.everyKm).concat([10000]));
  const cap=base*4;
  const isMajorNow=i=>i.category==='major'&&((i.everyKm>0&&i.everyKm<=cap)||(i.everyKm===0&&i.everyMonths>0&&i.everyMonths<=48));
  let items;
  if(kind==='minor')items=minorItems;
  else if(kind==='major')items=minorItems.concat(all.filter(isMajorNow));
  else items=all.filter(i=>i.category==='major'&&!isMajorNow(i));
  const parts=items.reduce((s,i)=>s+Number(i.partsCost||0),0);
  const labour=items.reduce((s,i)=>s+Number(i.labourCost||0),0);
  const kms=items.filter(i=>i.everyKm>0).map(i=>i.everyKm);
  const everyKm=kind==='minor'?base:(kms.length?Math.max(...kms):0);
  const result={items,parts,labour,total:parts+labour,everyKm};
  _pkgCache[key]=result;
  return result;
}

/* ---------- one-shot setup: anchors every schedule item from a few numbers ---------- */
function monthsBetween(a,b){const A=D(a),B=D(b);return (B.getFullYear()-A.getFullYear())*12+(B.getMonth()-A.getMonth())}
function anchorVehicle(v,o){
  const items=Q.items(v.id,false);
  const odo=Number(o.odo||0), start=o.startDate||today();
  const hasService=o.mode==='onSchedule';
  const svcKm=o.lastKm!==''&&o.lastKm!=null?Number(o.lastKm):null;
  const svcDate=o.lastDate||null;
  items.forEach(i=>{
    /* distance anchor */
    if(Number(i.everyKm)>0){
      let lk=Math.floor(odo/i.everyKm)*i.everyKm;              // assume kept to the book
      if(!hasService)lk=0;                                      // nothing ever done
      if(i.category==='minor'&&svcKm!=null)lk=Math.max(lk,svcKm);
      i.lastKm=Math.min(lk,odo);
    } else i.lastKm=0;
    /* time anchor */
    if(Number(i.everyMonths)>0){
      const el=Math.max(0,monthsBetween(start,today()));
      let ld=addMonths(start,Math.floor(el/i.everyMonths)*i.everyMonths);
      if(!hasService)ld=start;
      if(i.category==='minor'&&svcDate&&svcDate>ld)ld=svcDate;
      i.lastDate=ld;
    } else i.lastDate=(i.category==='minor'&&svcDate)?svcDate:start;
  });
  v.odo=odo; v.odoDate=o.odoDate||today(); v.startDate=start; v.setup=1;
  if(o.plate)v.plate=o.plate.toUpperCase().trim();
  if(o.vin)v.vin=o.vin.toUpperCase().trim();
  /* two odometer points so the km/day rate is measured, not guessed */
  if(DB.odoLog.filter(x=>x.vehicleId===v.id).length<2){
    DB.odoLog=DB.odoLog.filter(x=>x.vehicleId!==v.id);
    DB.odoLog.push({id:uid(),vehicleId:v.id,date:start,odo:0});
    DB.odoLog.push({id:uid(),vehicleId:v.id,date:v.odoDate,odo:odo});
  }
  if(o.taxExpiry){
    DB.docs.filter(d=>d.vehicleId===v.id&&(d.kind==='Road tax'||d.kind==='Insurance')).forEach(d=>{d.expiry=o.taxExpiry});
  }
}

async function callAI(msgs,opts){
  opts=opts||{};const c=aiCfg();const max=opts.maxTokens||1500;
  if(c.p.key&&!c.key)throw new Error('Add your '+c.p.name+' key in More → AI');

  if(c.id==='builtin'||c.id==='anthropic'){
    const body={model:c.model,max_tokens:max,messages:msgs.map(m=>({role:m.role,
      content:[...(m.atts||[]).filter(a=>a.mime.startsWith('image/')).map(a=>({type:'image',source:{type:'base64',media_type:a.mime,data:a.data}})),
               {type:'text',text:m.text||''}]}))};
    if(opts.system)body.system=opts.system;
    const h={'Content-Type':'application/json'};
    if(c.id==='anthropic'){h['x-api-key']=c.key;h['anthropic-version']='2023-06-01';h['anthropic-dangerous-direct-browser-access']='true'}
    const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:h,body:JSON.stringify(body)});
    if(!r.ok)throw new Error(await errText(r));
    const d=await r.json();return d.content.filter(x=>x.type==='text').map(x=>x.text).join('');
  }
  if(c.id==='gemini'){
    const contents=msgs.map(m=>({role:m.role==='assistant'?'model':'user',
      parts:[...(m.atts||[]).map(a=>({inline_data:{mime_type:a.mime,data:a.data}})),{text:m.text||''}]}));
    const body={contents,generationConfig:{temperature:opts.json?0.2:0.5,maxOutputTokens:max}};
    if(opts.json)body.generationConfig.responseMimeType='application/json';
    if(opts.system)body.systemInstruction={parts:[{text:opts.system}]};
    const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(c.model)}:generateContent?key=${encodeURIComponent(c.key)}`,
      {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    if(!r.ok)throw new Error(await errText(r));
    const d=await r.json();
    const cand=(d.candidates||[])[0];
    if(!cand)throw new Error('No answer came back — the file may be too large.');
    return (cand.content.parts||[]).map(x=>x.text||'').join('');
  }
  /* OpenAI-compatible: openai, openrouter, custom */
  const base=c.id==='openai'?'https://api.openai.com/v1':c.id==='openrouter'?'https://openrouter.ai/api/v1':(c.baseUrl||'').replace(/\/$/,'');
  if(!base)throw new Error('Set the base URL for your custom provider');
  const mm=msgs.map(m=>({role:m.role,content:(m.atts||[]).length
    ? [...(m.atts).filter(a=>a.mime.startsWith('image/')).map(a=>({type:'image_url',image_url:{url:`data:${a.mime};base64,${a.data}`}})),{type:'text',text:m.text||''}]
    : m.text}));
  if(opts.system)mm.unshift({role:'system',content:opts.system});
  const r=await fetch(base+'/chat/completions',{method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+c.key},
    body:JSON.stringify({model:c.model,messages:mm,max_tokens:max,...(opts.json?{response_format:{type:'json_object'}}:{})})});
  if(!r.ok)throw new Error(await errText(r));
  const d=await r.json();return d.choices[0].message.content;
}
async function callAIStream(msgs,opts,onDelta){
  opts=opts||{};const c=aiCfg();const max=opts.maxTokens||1500;
  if(c.p.key&&!c.key)throw new Error('Add your '+c.p.name+' key in More → AI');
  const ctrl=new AbortController();AI_ABORT=ctrl;
  let url,body,headers={'Content-Type':'application/json'},flavour;
  if(c.id==='builtin'||c.id==='anthropic'){
    flavour='anthropic';url='https://api.anthropic.com/v1/messages';
    body={model:c.model,max_tokens:max,stream:true,messages:msgs.map(m=>({role:m.role,
      content:[...(m.atts||[]).filter(a=>a.mime.startsWith('image/')).map(a=>({type:'image',source:{type:'base64',media_type:a.mime,data:a.data}})),
               {type:'text',text:m.text||''}]}))};
    if(opts.system)body.system=opts.system;
    if(c.id==='anthropic'){headers['x-api-key']=c.key;headers['anthropic-version']='2023-06-01';headers['anthropic-dangerous-direct-browser-access']='true'}
  } else if(c.id==='gemini'){
    flavour='gemini';
    url=`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(c.model)}:streamGenerateContent?alt=sse&key=${encodeURIComponent(c.key)}`;
    body={contents:msgs.map(m=>({role:m.role==='assistant'?'model':'user',
      parts:[...(m.atts||[]).map(a=>({inline_data:{mime_type:a.mime,data:a.data}})),{text:m.text||''}]})),
      generationConfig:{temperature:.5,maxOutputTokens:max}};
    if(opts.system)body.systemInstruction={parts:[{text:opts.system}]};
  } else {
    flavour='openai';
    const base=c.id==='openai'?'https://api.openai.com/v1':c.id==='openrouter'?'https://openrouter.ai/api/v1':(c.baseUrl||'').replace(/\/$/,'');
    if(!base)throw new Error('Set the base URL for your custom provider');
    url=base+'/chat/completions';headers['Authorization']='Bearer '+c.key;
    const mm=msgs.map(m=>({role:m.role,content:(m.atts||[]).length
      ?[...(m.atts).filter(a=>a.mime.startsWith('image/')).map(a=>({type:'image_url',image_url:{url:`data:${a.mime};base64,${a.data}`}})),{type:'text',text:m.text||''}]
      :m.text}));
    if(opts.system)mm.unshift({role:'system',content:opts.system});
    body={model:c.model,messages:mm,max_tokens:max,stream:true};
  }
  const r=await fetch(url,{method:'POST',headers,body:JSON.stringify(body),signal:ctrl.signal});
  if(!r.ok)throw new Error(await errText(r));
  if(!r.body||!r.body.getReader){const d=await r.json();const t=pluck(d,flavour);onDelta(t,t);return t}
  const reader=r.body.getReader(),dec=new TextDecoder();let buf='',full='';
  while(true){
    const {done,value}=await reader.read();if(done)break;
    buf+=dec.decode(value,{stream:true});
    const lines=buf.split('\n');buf=lines.pop();
    for(const line of lines){
      const t=line.trim();if(!t.startsWith('data:'))continue;
      const payload=t.slice(5).trim();
      if(!payload||payload==='[DONE]')continue;
      let j;try{j=JSON.parse(payload)}catch(e){continue}
      let piece='';
      if(flavour==='anthropic')piece=(j.type==='content_block_delta'&&j.delta&&j.delta.text)||'';
      else if(flavour==='gemini')piece=(((j.candidates||[])[0]||{}).content||{}).parts?.map(x=>x.text||'').join('')||'';
      else piece=(((j.choices||[])[0]||{}).delta||{}).content||'';
      if(piece){full+=piece;onDelta(piece,full)}
    }
  }
  AI_ABORT=null;
  if(!full)throw new Error('Empty reply — the file may be too large for this model.');
  return full;
}
function pluck(d,f){
  if(f==='anthropic')return (d.content||[]).filter(x=>x.type==='text').map(x=>x.text).join('');
  if(f==='gemini')return ((((d.candidates||[])[0]||{}).content||{}).parts||[]).map(x=>x.text||'').join('');
  return ((d.choices||[])[0]||{}).message?.content||'';
}
let AI_ABORT=null;
async function errText(r){
  let t='';try{const j=await r.json();t=(j.error&&(j.error.message||j.error.type))||JSON.stringify(j).slice(0,140)}catch(e){t=await r.text().catch(()=>'')}
  if(r.status===401||r.status===403)return 'Key rejected ('+r.status+'). Check it in More → AI.';
  if(r.status===429)return 'Rate limited — wait a moment, or the free quota is used up.';
  return (t||('HTTP '+r.status)).slice(0,180);
}
function parseJSON(t){
  let s=String(t).replace(/```json|```/g,'').trim();
  const a=s.indexOf('{'),b=s.lastIndexOf('}');
  if(a>=0&&b>a)s=s.slice(a,b+1);
  return JSON.parse(s);
}

function vehicleContext(v){
  if(!v)return 'No specific vehicle selected.';
  const due=Q.items(v.id).map(i=>statusOf(i,v))
    .filter(x=>x.state==='over'||x.state==='soon').slice(0,8)
    .map(x=>`- ${x.item.name}: ${x.state==='over'?'OVERDUE':'due soon'} (${relDays(x.days)})`).join('\n');
  const hist=Q.logs(v.id).sort((a,b)=>a.date<b.date?1:-1).slice(0,6)
    .map(l=>`- ${l.date} @ ${l.odo} km: ${l.title} (${money(logTotal(l))})`).join('\n');
  const mods=DB.mods.filter(m=>m.vehicleId===v.id&&m.status==='done').map(m=>'- '+m.name).join('\n');
  return `VEHICLE: ${v.year||''} ${v.make||''} ${v.model||v.name}${v.type==='moto'?' (motorcycle)':''}
Odometer: ${km(v.odo)} · averaging ${avgKmDay(v).toFixed(0)} km/day${v.plate?' · plate '+v.plate:''}${v.vin?' · VIN '+v.vin:''}
${due?'DUE OR OVERDUE NOW:\n'+due:'Nothing overdue.'}
${hist?'RECENT SERVICE:\n'+hist:'No service logged yet.'}
${mods?'MODIFICATIONS FITTED:\n'+mods:''}`;
}

let ASK_V=null, ATTS=[], REC=null, RECT=null, ASK_BUSY=false, ASK_DRAFT='', ASK_PINNED=true;

function md(t){
  let h=esc(t);
  h=h.replace(/```([\s\S]*?)```/g,(m,c)=>`<pre>${c.trim()}</pre>`);
  h=h.replace(/`([^`\n]+)`/g,'<code>$1</code>');
  h=h.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/(^|\s)\*([^*\n]+)\*/g,'$1<em>$2</em>');
  const lines=h.split('\n');let out=[],list=null;
  for(let raw of lines){
    const line=raw.trimEnd();
    let m;
    if(/^\s*#{1,3}\s+/.test(line)){ if(list){out.push(`</${list}>`);list=null}
      out.push(`<h4>${line.replace(/^\s*#{1,3}\s+/,'')}</h4>`);continue}
    if((m=line.match(/^\s*[-•*]\s+(.*)$/))){ if(list!=='ul'){if(list)out.push(`</${list}>`);out.push('<ul>');list='ul'}
      out.push(`<li>${m[1]}</li>`);continue}
    if((m=line.match(/^\s*(\d+)[.)]\s+(.*)$/))){ if(list!=='ol'){if(list)out.push(`</${list}>`);out.push('<ol>');list='ol'}
      out.push(`<li>${m[2]}</li>`);continue}
    if(list){out.push(`</${list}>`);list=null}
    out.push(line.trim()?`<p>${line}</p>`:'');
  }
  if(list)out.push(`</${list}>`);
  return out.join('');
}
async function fileToAtt(f){
  if(f.size>18*1024*1024&&!f.type.startsWith('image/'))
    throw new Error('That clip is '+(f.size/1048576).toFixed(0)+' MB. Keep it under 18 MB — 10 seconds is plenty.');
  if(f.type.startsWith('image/')){
    const du=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)});
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=du});
    const max=1280,sc=Math.min(1,max/Math.max(img.width,img.height));
    const c=document.createElement('canvas');c.width=img.width*sc;c.height=img.height*sc;
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    const out=c.toDataURL('image/jpeg',.72);
    return {mime:'image/jpeg',data:out.split(',')[1],preview:out,kind:'photo'};
  }
  const du=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)});
  return {mime:(f.type||'application/octet-stream').split(';')[0],data:du.split(',')[1],preview:'',
    kind:f.type.startsWith('audio')?'sound':f.type.startsWith('video')?'video':'file',
    name:f.name||'',size:(f.size/1048576).toFixed(1)+' MB'};
}
function attachFile(accept,capture){
  const need=/audio/.test(accept)?'audio':/video/.test(accept)?'video':'vision';
  if(!aiCan(need))return toast('This AI cannot take '+(need==='audio'?'sound':need==='video'?'video':'photos')+' — switch to Gemini in More → AI');
  const i=document.createElement('input');i.type='file';i.accept=accept;if(capture)i.setAttribute('capture','environment');
  i.onchange=async()=>{const f=i.files[0];if(!f)return;
    try{ATTS.push(await fileToAtt(f));paintAtts()}catch(e){toast(e.message)}};
  i.click();
}
window.attachFile=attachFile;
async function toggleRecord(){
  if(REC)return stopRecord();
  if(!aiCan('audio'))return toast('Only Gemini can listen — switch provider in More → AI');
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)return toast('This browser cannot record');
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    const types=['audio/mp4','audio/ogg;codecs=opus','audio/webm;codecs=opus','audio/webm'];
    const mt=(window.MediaRecorder&&types.find(t=>MediaRecorder.isTypeSupported(t)))||'';
    const chunks=[];const t0=Date.now();
    REC=new MediaRecorder(stream,mt?{mimeType:mt}:undefined);
    REC.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
    REC.onstop=async()=>{
      stream.getTracks().forEach(t=>t.stop());
      const type=(REC.mimeType||'audio/mp4').split(';')[0];
      const b=new Blob(chunks,{type});
      const du=await new Promise(res=>{const r=new FileReader();r.onload=()=>res(r.result);r.readAsDataURL(b)});
      ATTS.push({mime:type,data:du.split(',')[1],kind:'sound',name:Math.round((Date.now()-t0)/1000)+'s',preview:''});
      REC=null;clearInterval(RECT);RECT=null;paintAtts();
    };
    REC.start();
    RECT=setInterval(()=>{const el=document.getElementById('recTime');
      if(el)el.textContent=Math.round((Date.now()-t0)/1000)+'s'},250);
    paintAtts();
  }catch(e){toast('Microphone blocked — allow it in your browser settings')}
}
window.toggleRecord=toggleRecord;

  try{
    const hist=DB.chat.filter(m=>m.vehicleId===ASK_V&&m.text).slice(-11,-1).map(m=>({role:m.role,text:m.text}));

      (piece,full)=>{acc=full;paintThread(full)});

/* ============================ DRIVE — live GPS speedometer & trip logger ============================ */
const TRIP={
  on:false, vid:null, watch:null, wake:null, t0:0, pausedMs:0, lastMoveT:0,
  pts:[], dist:0, pend:0, anchor:null, anchorT:0, max:0, speed:0, acc:null, fix:false, moving:false, pausedAt:0,
  alertAt:0, lastAlert:0, raf:null
};
function haversine(a,b){
  const R=6371000,toR=x=>x*Math.PI/180;
  const dLat=toR(b.lat-a.lat),dLon=toR(b.lon-a.lon);
  const la1=toR(a.lat),la2=toR(b.lat);
  const h=Math.sin(dLat/2)**2+Math.cos(la1)*Math.cos(la2)*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.min(1,Math.sqrt(h)));
}
function hhmmss(ms){
  const s=Math.max(0,Math.floor(ms/1000));
  const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),ss=s%60;
  return (h?h+':':'')+String(m).padStart(h?2:1,'0')+':'+String(ss).padStart(2,'0');
}
function tripElapsed(){return TRIP.on?(Date.now()-TRIP.t0-TRIP.pausedMs):0}

function openDrive(vid){
  if(!DB.vehicles.length)return toast('Add a vehicle first');
  TRIP.vid=vid||TRIP.vid||(DB.vehicles[0]||{}).id;
  if(!vehicleOf(TRIP.vid))TRIP.vid=(DB.vehicles[0]||{}).id;
  TRIP.alertAt=Number((DB.settings.driveAlert)||0);
  document.getElementById('drive').classList.add('on');
  document.body.classList.add('noscroll');
  paintDrive();
}
window.openDrive=openDrive;
function closeDrive(){
  if(TRIP.on)return toast('Stop the trip first');
  document.getElementById('drive').classList.remove('on');
  document.body.classList.remove('noscroll');
  render();
}
window.closeDrive=closeDrive;

async function startTrip(){
  if(TRIP.on)return;
  if(!navigator.geolocation)return toast('This device has no GPS access');
  const v=vehicleOf(TRIP.vid);
  if(!v)return toast('Pick a vehicle first');
  TRIP.on=true;TRIP.t0=Date.now();TRIP.pausedMs=0;TRIP.pts=[];TRIP.dist=0;TRIP.pend=0;TRIP.anchor=null;TRIP.anchorT=0;TRIP.max=0;
  TRIP.speed=0;TRIP.fix=false;TRIP.acc=null;TRIP.moving=false;TRIP.pausedAt=0;TRIP.lastMoveT=Date.now();
  TRIP.startOdo=Number(v.odo||0);
  try{
    if('wakeLock' in navigator){TRIP.wake=await navigator.wakeLock.request('screen');
      TRIP.wake.addEventListener&&TRIP.wake.addEventListener('release',()=>{TRIP.wake=null})}
  }catch(e){}
  TRIP.watch=navigator.geolocation.watchPosition(onFix,onFixErr,
    {enableHighAccuracy:true,maximumAge:1000,timeout:20000});
  tick();
  paintDrive();
}
window.startTrip=startTrip;

function onFix(pos){
  const c=pos.coords;
  TRIP.acc=c.accuracy;
  if(c.accuracy>50){paintDrive();return}          // too vague to trust
  TRIP.fix=true;
  const now=pos.timestamp||Date.now();
  const pt={lat:c.latitude,lon:c.longitude,t:now};
  // speed: prefer the device's own value, else derive it
  let sp=(c.speed!=null&&c.speed>=0&&isFinite(c.speed))?c.speed:null;
  const prev=TRIP.pts[TRIP.pts.length-1];
  if(prev){
    const step=haversine(prev,pt), dt=(now-prev.t)/1000;
    if(sp==null&&dt>0)sp=step/dt;
    // Reject physically impossible jumps. dt can be zero or negative when fixes
    // arrive out of order, so a step that large is untrustworthy either way.
    const tooFast = dt>0 ? (step/dt)>90 : step>200;
    if(tooFast){TRIP.pts.push(pt);TRIP.anchor=pt;TRIP.speed=0;paintDrive();return}
  }
  // Distance is measured as net displacement from an anchor, not as a sum of
  // steps. Parked jitter wanders around the anchor and never commits; real
  // crawling walks away from it and does. This is what keeps a traffic jam
  // honest without inventing kilometres in a car park.
  if(!TRIP.anchor){TRIP.anchor=pt;TRIP.anchorT=now}
  else{
    const net=haversine(TRIP.anchor,pt);
    const gate=Math.max(10,(c.accuracy||10)*0.8);
    if(net>=gate){
      const span=Math.max(1,(now-(TRIP.anchorT||now))/1000);
      // never credit more than ~320 km/h worth of ground between anchors
      TRIP.dist += Math.min(net, span*90);
      TRIP.anchor=pt;TRIP.anchorT=now;
    }
  }
  TRIP.pts.push(pt);
  if(TRIP.pts.length>5000)TRIP.pts.splice(0,2000);
  TRIP.speed=Math.max(0,(sp||0)*3.6);
  if(TRIP.speed>TRIP.max&&TRIP.speed<300)TRIP.max=TRIP.speed;
  TRIP.moving=TRIP.speed>3;
  if(TRIP.moving)TRIP.lastMoveT=Date.now();
  if(TRIP.alertAt>0&&TRIP.speed>TRIP.alertAt&&Date.now()-TRIP.lastAlert>8000){
    TRIP.lastAlert=Date.now();
    try{navigator.vibrate&&navigator.vibrate([120,60,120])}catch(e){}
  }
  paintDrive();
}
function onFixErr(e){
  TRIP.fix=false;
  TRIP.gpsErr = e.code===1?'Location permission denied'
    : e.code===2?'No GPS signal' : 'Waiting for GPS';
  paintDrive();
}
function tick(){
  if(!TRIP.on)return;
  paintDrive();
  TRIP.raf=setTimeout(tick,1000);
}
async function stopTrip(){
  if(!TRIP.on)return;
  TRIP.on=false;
  if(TRIP.watch!=null){try{navigator.geolocation.clearWatch(TRIP.watch)}catch(e){}TRIP.watch=null}
  if(TRIP.raf){clearTimeout(TRIP.raf);TRIP.raf=null}
  if(TRIP.wake){try{await TRIP.wake.release()}catch(e){}TRIP.wake=null}
  const kmDone=TRIP.dist/1000;
  const dur=tripElapsed();
  const v=vehicleOf(TRIP.vid);
  if(kmDone<0.1||!v){paintDrive();return toast('Trip too short to record')}
  const movingSec=Math.max(1,dur/1000);
  const avg=kmDone/(movingSec/3600);
  tripSummary({km:kmDone,dur,avg,max:TRIP.max,vid:TRIP.vid});
}
window.stopTrip=stopTrip;

function saveTrip(kmDone,dur,max,vid,applyOdo){
  const v=vehicleOf(vid);
  DB.trips=DB.trips||[];
  DB.trips.push({id:uid(),vehicleId:vid,date:today(),ts:Date.now(),

  paintDrive();
  toast(applyOdo?'Logged · odometer now '+km(v.odo):'Trip logged');

/* ============================ TYRE TRACKER ============================ */
// Standard pressures (PSI / bar). Each vehicle stores its own targets.
// A tyre record: {id, vehicleId, position, target, current, date, treadMm, brand, notes}
// Positions: FL,FR,RL,RR for cars; F,R for moto; S=spare
function tyresOf(vid){return Q.tyres(vid)}
function tyreState(tr,v){
  // target from tyre record, fall back to vehicle defaults
  const tgt=Number(tr.target||v.tyrePsi||32);
  const cur=Number(tr.current||0);
  const days=tr.date?Math.round((new Date()-new Date(tr.date+'T00:00:00'))/864e5):null;
  const pctOff=tgt>0?Math.abs(cur-tgt)/tgt:0;
  let state='idle';
  if(cur>0){
    if(cur<tgt*0.85||cur>tgt*1.15) state='over';        // >15% off
    else if(pctOff>=0.06) state='soon';                   // 6-15% off
    else state='ok';
  }
  // tread warning: legal minimum 1.6mm, warn below 3mm
  const tread=Number(tr.treadMm||0);
  const treadState=tread>0?(tread<1.6?'over':tread<3?'soon':'ok'):'idle';
  const stale=days!=null&&days>30;
  return {tgt,cur,state:stale&&state==='ok'?'soon':state,treadState,days,stale,pctOff};
}
function tyreIcon(pos){
  const icons={FL:'↖',FR:'↗',RL:'↙',RR:'↘',F:'↑',R:'↓',S:'○'};
  return icons[pos]||pos;
}
function viewTyres(vid){
  const v=vehicleOf(vid);if(!v)return '';
  const tyres=Q.tyres(vid);
  const moto=v.type==='moto';
  const positions=moto?['F','R']:['FL','FR','RL','RR'];
  let h=`<div class="sect"><h2>Tyres</h2><div class="rule"></div>
    <button class="btn sm ghost" onclick="editTyre(null,'${vid}')">+ Add</button></div>`;
  if(!tyres.length){
    h+=`<div class="empty small">No tyre records. Add your tyres to track pressure and tread depth.
      <br><br>Target pressure (PSI) for this vehicle:<br>
      <div class="row" style="gap:8px;margin-top:8px">
        <input id="tyrePsi_${vid}" type="number" inputmode="decimal" value="${v.tyrePsi||32}" style="width:70px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;color:var(--text)">
        <button class="btn sm" onclick="setTyrePsi('${vid}')">Save default</button>
      </div></div>`;
    return h;
  }
  // diagram: simple grid matching wheel positions
  const grid=moto?['F','R']:['FL','FR','RL','RR'];
  h+=`<div class="tyrediag ${moto?'moto':'car'}">`;
  grid.forEach(pos=>{
    const tr=tyres.find(t=>t.position===pos);
    if(!tr){h+=`<div class="tyreslot empty" onclick="editTyre(null,'${vid}',${JSON.stringify(JSON.stringify(pos))})">
      <span class="dim tiny">${pos}</span><span class="dim">+</span></div>`;return}
    const st=tyreState(tr,v);
    h+=`<div class="tyreslot st-${st.state}" onclick="editTyre('${tr.id}')">
      <div class="tyrepos">${pos}</div>
      <div class="tyrepsi num">${tr.current||'—'}</div>
      <div class="tyretgt dim tiny">/${st.tgt} PSI</div>
      ${st.treadState!=='idle'?`<div class="tyretread st-${st.treadState}">${tr.treadMm}mm</div>`:''}
      ${st.stale?'<div class="tiny" style="color:var(--soon)">stale</div>':''}
    </div>`;
  });
  // spare
  const spare=tyres.find(t=>t.position==='S');
  h+=`</div>`;
  if(spare){const st=tyreState(spare,v);
    h+=`<div class="card tap" onclick="editTyre('${spare.id}')"><div class="between">
      <div><div class="label">Spare</div><div class="num small">${spare.current||'—'} / ${st.tgt} PSI</div></div>
      <span class="pill st-${st.state}">${spare.current?st.state==='ok'?'Good':stateLabel[st.state]:'Not logged'}</span></div></div>`;}
  // tread detail
  const withTread=tyres.filter(t=>t.treadMm>0);
  if(withTread.length){
    h+=`<div class="sect"><h2>Tread</h2><div class="rule"></div></div>`;
    withTread.forEach(tr=>{const st=tyreState(tr,v);
      h+=`<div class="card tap" onclick="editTyre('${tr.id}')"><div class="between">
        <div><div class="label">${tr.position}${tr.brand?' · '+esc(tr.brand):''}</div>
        <div class="num">${tr.treadMm} mm</div></div>
        <span class="pill st-${st.treadState}">${st.treadMm<1.6?'Replace now':st.treadState==='soon'?'<3mm warning':'OK'}</span>
      </div></div>`;});
  }
  h+=`<div class="sect"><h2>Last checked</h2><div class="rule"></div></div>`;
  tyres.filter(t=>t.date).sort((a,b)=>a.date>b.date?-1:1).slice(0,1).forEach(tr=>{
    h+=`<div class="small muted" style="padding:4px 0">Most recent reading: ${fmtDate(tr.date)}</div>`;});
  return h;
}
function setTyrePsi(vid){
  const el=document.getElementById('tyrePsi_'+vid);
  const v=vehicleOf(vid);if(!v||!el)return;
  const n=Number(el.value);if(n>0&&n<120)v.tyrePsi=n;
  save();render();toast('Default pressure saved');
}
window.setTyrePsi=setTyrePsi;
function editTyre(id,vid,posJson){
  const existing=id?(DB.tyres||[]).find(t=>t.id===id):null;
  const v=vehicleOf(vid||(existing&&existing.vehicleId));
  const moto=v&&v.type==='moto';
  const defaultPos=posJson?JSON.parse(posJson):'FL';
  const positions=moto?['F','R','S']:['FL','FR','RL','RR','S'];
  form(id?'Edit tyre':'Add tyre',[
    {k:'vehicleId',label:'Vehicle',type:'select',opts:DB.vehicles.map(v=>[v.id,v.name]),val:(existing&&existing.vehicleId)||vid},
    {k:'position',label:'Position',type:'select',opts:positions.map(p=>[p,{FL:'Front left',FR:'Front right',RL:'Rear left',RR:'Rear right',F:'Front',R:'Rear',S:'Spare'}[p]||p]),val:(existing&&existing.position)||defaultPos},
    {k:'brand',label:'Brand & size',val:existing&&existing.brand,ph:'Michelin Pilot Street 110/70-17'},
    {k:'current',label:'Current pressure (PSI)',type:'number',val:existing&&existing.current,half:1},
    {k:'target',label:'Target pressure (PSI)',type:'number',val:(existing&&existing.target)||(v&&v.tyrePsi)||32,half:1},
    {k:'treadMm',label:'Tread depth (mm)',type:'number',val:existing&&existing.treadMm,half:1,hint:'Legal min: 1.6 mm. Warn at: 3 mm.'},
    {k:'date',label:'Checked on',type:'date',val:(existing&&existing.date)||today(),half:1},
    {k:'notes',label:'Notes',type:'textarea',val:existing&&existing.notes},
  ],d=>{
    DB.tyres=DB.tyres||[];
    if(id)Object.assign(existing,d);
    else DB.tyres.push(Object.assign({id:uid()},d));
    toast('Tyre saved');
  },id?`<div class="row" style="gap:8px;margin-bottom:12px">
    <button class="btn dang sm grow" onclick="confirmDo('Remove this tyre record.',()=>{DB.tyres=DB.tyres.filter(t=>t.id!=='${id}')})">Delete</button></div>`:''
  );
}
window.editTyre=editTyre;

function tyreSummaryFor(vid){
  const v=vehicleOf(vid);if(!v)return null;
  const tyres=Q.tyres(vid);if(!tyres.length)return null;
  const states=tyres.map(t=>tyreState(t,v));
  const worst=states.some(s=>s.state==='over')?'over':states.some(s=>s.state==='soon')?'soon':'ok';
  const lowTread=states.filter(s=>s.treadState==='over'||s.treadState==='soon').length;
  return {worst,lowTread,count:tyres.length};
}
function tyreAlerts(){
  const alerts=[];
  DB.vehicles.forEach(v=>{
    const s=tyreSummaryFor(v.id);
    if(s&&(s.worst!=='ok'||s.lowTread))alerts.push({v,s});
  });
  return alerts;
}

/* ============================ CALENDAR + NOTIFICATIONS ============================ */
function downloadICS(title,dateISO,desc){
  const dt=dateISO.replace(/-/g,'');
  const ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Garajku//EN','CALSCALE:GREGORIAN','BEGIN:VEVENT',
    'UID:'+uid()+'@servis','DTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').split('.')[0]+'Z',
    'DTSTART;VALUE=DATE:'+dt,'DTEND;VALUE=DATE:'+dt,'SUMMARY:'+title,'DESCRIPTION:'+String(desc||'').replace(/\n/g,'\\n'),
    'BEGIN:VALARM','TRIGGER:-P7D','ACTION:DISPLAY','DESCRIPTION:'+title,'END:VALARM','END:VEVENT','END:VCALENDAR'].join('\r\n');
  const b=new Blob([ics],{type:'text/calendar'}),u=URL.createObjectURL(b);
  const a=document.createElement('a');a.href=u;a.download=title.replace(/[^a-z0-9]+/gi,'-').toLowerCase()+'.ics';a.click();
  setTimeout(()=>URL.revokeObjectURL(u),3000);
  toast('Calendar file saved — open it to add the reminder');
}
function icsFor(id){
  const it=DB.items.find(i=>i.id===id),v=vehicleOf(it.vehicleId),x=statusOf(it,v);
  const when=x.dueDate&&D(x.dueDate)>new Date()?x.dueDate:today();
  downloadICS(`${v.name}: ${it.name}`,when,`Estimated ${money(x.cost)}. Due at ${x.nextKm?km(x.nextKm):'—'}. Logged in Garajku.`);
}
window.icsFor=icsFor;
function icsDoc(id){const d=DB.docs.find(x=>x.id===id),v=vehicleOf(d.vehicleId);
  downloadICS(`${v?v.name:''}: ${d.kind} expires`,d.expiry,`Renewal about ${money(d.cost)}.`)}
window.icsDoc=icsDoc;
function icsAll(){
  const rows=allDue().filter(x=>x.state!=='idle'&&x.days<400);
  if(!rows.length)return toast('Nothing due in the next year');
  const ev=rows.map(x=>{const when=x.dueDate&&D(x.dueDate)>new Date()?x.dueDate:today();
    return ['BEGIN:VEVENT','UID:'+uid()+'@servis','DTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').split('.')[0]+'Z',
    'DTSTART;VALUE=DATE:'+when.replace(/-/g,''),'DTEND;VALUE=DATE:'+when.replace(/-/g,''),
    'SUMMARY:'+x.vehicle.name+': '+x.item.name,'DESCRIPTION:Estimated '+money(x.cost),
    'BEGIN:VALARM','TRIGGER:-P7D','ACTION:DISPLAY','DESCRIPTION:Service due','END:VALARM','END:VEVENT'].join('\r\n')}).join('\r\n');
  const ics='BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Garajku//EN\r\n'+ev+'\r\nEND:VCALENDAR';
  const b=new Blob([ics],{type:'text/calendar'}),u=URL.createObjectURL(b);
  const a=document.createElement('a');a.href=u;a.download='garajku-schedule.ics';a.click();
  toast(rows.length+' reminders exported');
}
window.icsAll=icsAll;
async function askNotify(){
  if(!('Notification' in window))return toast('This browser has no notifications');
  const p=await Notification.requestPermission();
  toast(p==='granted'?'Notifications on — you\'ll be told when you open the app':'Notifications blocked');
  if(p==='granted')checkNotify(true);
}
window.askNotify=askNotify;
function checkNotify(force){
  if(!('Notification' in window)||Notification.permission!=='granted')return;
  const last=DB.settings.lastNotify;
  if(!force&&last===today())return;
  const rows=allDue().filter(x=>x.state==='over'||x.state==='soon');
  const docs=DB.docs.map(d=>({d,...docStatus(d)})).filter(x=>x.state==='over'||x.state==='soon');
  if(!rows.length&&!docs.length)return;
  const top=rows[0];
  const body=[top?`${top.vehicle.name}: ${top.item.name} — ${relDays(top.days)}`:'',
    (rows.length+docs.length>1)?`+${rows.length+docs.length-1} more waiting`:''].filter(Boolean).join('\n');
  try{new Notification('Garajku — something needs doing',{body,icon:'icon-192.png',tag:'garajku'})}catch(e){}
  DB.settings.lastNotify=today();save();
}

function saveSettings(){
  const g=id=>document.getElementById(id);
  if(g('s_days'))DB.settings.soonDays=Number(g('s_days').value)||30;
  if(g('s_km'))DB.settings.soonKm=Number(g('s_km').value)||500;
  if(g('s_cur'))DB.settings.currency=g('s_cur').value||'RM';
  const a=DB.settings.ai=DB.settings.ai||{keys:{},models:{}};
  a.keys=a.keys||{};a.models=a.models||{};
  if(g('s_prov'))a.provider=g('s_prov').value;
  if(g('s_key'))a.keys[a.provider]=g('s_key').value.trim();
  if(g('s_model'))a.models[a.provider]=g('s_model').value.trim();
  if(g('s_base'))a.baseUrl=g('s_base').value.trim();
  save();render();toast('Saved');
}

  const out=document.getElementById('aiTest');
  saveSettings();
  const o=document.getElementById('aiTest');if(o){o.innerHTML='<span class="spin"></span> testing…'}
  try{
    const r=await callAI([{role:'user',text:'Reply with exactly: ready'}],{maxTokens:20});
    const el=document.getElementById('aiTest');
    if(el)el.innerHTML='<span style="color:var(--ok)">Connected — '+esc(String(r).trim().slice(0,40))+'</span>';
  }catch(e){
    const el=document.getElementById('aiTest');
    if(el)el.innerHTML='<span style="color:var(--over)">'+esc(e.message)+'</span>';
  }
}
window.testAI=testAI;
window.saveSettings=saveSettings;
function exportData(){
  const b=new Blob([JSON.stringify(DB,null,1)],{type:'application/json'}),u=URL.createObjectURL(b);
  const a=document.createElement('a');a.href=u;a.download='garajku-backup-'+today()+'.json';a.click();
  toast('Backup saved (photos not included)');
}
window.exportData=exportData;
function importData(){
  const i=document.createElement('input');i.type='file';i.accept='application/json';
  i.onchange=()=>{const f=i.files[0];if(!f)return;const r=new FileReader();
    r.onload=()=>{try{
      const d=JSON.parse(r.result);
      if(!d||!Array.isArray(d.vehicles))throw 0;
      const arr=x=>Array.isArray(x)?x:[];
      d.vehicles=arr(d.vehicles);d.items=arr(d.items);d.mods=arr(d.mods);
      d.docs=arr(d.docs);d.logs=arr(d.logs);d.odoLog=arr(d.odoLog);d.chat=arr(d.chat);d.trips=arr(d.trips);d.tyres=arr(d.tyres);
      d.mods.forEach(m=>{m.priority=Math.max(0,Math.min(3,Math.round(Number(m.priority)||0)))});
      d.settings=Object.assign({currency:'RM',soonDays:30,soonKm:500,ai:{provider:'builtin',keys:{},models:{},baseUrl:''}},d.settings||{});
      DB=d;save();CURV=null;MFILTER='all';FILTER='all';render();
      toast('Restored '+d.vehicles.length+' vehicles, '+d.mods.length+' mods');
    }catch(e){toast('That file isn\'t a Garajku backup')}};
    r.readAsText(f)};
  i.click();
}
window.importData=importData;

/* ============================ RENDER ============================ */
const TITLES={due:['Today','Garajku'],garage:['Garage','Vehicles'],ask:['Mechanic','Ask'],log:['Records','History'],mods:['Build','Mods'],more:['Setup','More']};
let _rendering=false;
function render(){
  if(_rendering)return;
  _rendering=true;
  try{renderInner()}catch(err){
    const v=document.getElementById('view');
    if(v)v.innerHTML=`<div class="card" style="border-color:#4A2A27">
      <b>This screen hit a problem.</b>
      <p class="small muted" style="margin:7px 0 0">${esc(err.message||'Unknown error')}</p>
      <p class="small muted">Your data is safe. Back it up from More, then try again.</p>
      <div class="row" style="gap:8px;margin-top:11px">
        <button class="btn sm grow" onclick="go('due')">Go to Due</button>
        <button class="btn sm grow" onclick="go('more')">Open More</button></div></div>`;
    _rendering=false;
    try{renderTabs()}catch(e){}
  }
}
function renderInner(){
  const v=document.getElementById('view');
  let html='',t=TITLES[VIEW];
  if(VIEW==='due')html=viewDue();
  else if(VIEW==='garage'){html=viewGarage(); if(CURV&&vehicleOf(CURV)){t=['Vehicle',vehicleOf(CURV).name]}}
  else if(VIEW==='ask')html=viewAsk();
  else if(VIEW==='log')html=viewLog();
  else if(VIEW==='mods')html=viewMods();
  else html=viewMore();
  document.getElementById('topEyebrow').textContent=t[0];
  document.getElementById('topTitle').textContent=t[1];
  const due=allDue().filter(x=>x.state==='over').length;
  const btBadge = BT_CONNECTED
    ? `<span class="pill" style="--c:var(--ok);margin-right:4px"><svg viewBox="0 0 24 24" style="width:10px;height:10px;stroke:currentColor;fill:none;stroke-width:2;display:inline-block;vertical-align:middle;margin-right:3px"><path d="m7 7 10 5-5 5V3l5 5L7 17"/></svg>BT</span>`
    : '';
  document.getElementById('topRight').innerHTML = (VIEW==='due'&&due)
    ? btBadge + `<span class="pill st-over">${due} overdue</span>`
    : btBadge;
  v.className='wrap'+(VIEW==='ask'?' chat':'');
  v.innerHTML=html;
  if(VIEW!=='ask'){v.classList.remove('fade');void v.offsetWidth;v.classList.add('fade')}
  _rendering=false;
  renderTabs();
  if(VIEW==='ask')askMount();
  hydratePhotos();
  document.getElementById('fab').style.display=(VIEW==='more'||VIEW==='ask')?'none':'grid';

}
window.render=render;
document.getElementById('fab').onclick=()=>{
  if(VIEW==='garage'&&CURV)return editItem(null,CURV);
  if(VIEW==='garage')return editVehicle(null);
  if(VIEW==='mods')return editMod(null);
  if(VIEW==='log')return logForm({vehicleId:(DB.vehicles[0]||{}).id,date:today(),odo:(DB.vehicles[0]||{}).odo});
  /* due view: quick actions */
  if(!DB.vehicles.length)return editVehicle(null);
  sheet(`<h3>Add</h3>
   <div class="row" style="gap:8px;flex-wrap:wrap">
     <button class="btn grow" onclick="closeSheet();logForm({vehicleId:DB.vehicles[0]&&DB.vehicles[0].id,date:today(),odo:DB.vehicles[0]&&DB.vehicles[0].odo})">Service record</button>
     <button class="btn grow" onclick="closeSheet();updateOdo(DB.vehicles[0].id)">Odometer</button>

   <div class="row" style="gap:8px;margin-top:8px">

   <div class="row" style="gap:8px;margin-top:8px">
     <button class="btn grow" onclick="closeSheet();editMod(null)">Modification</button>
     <button class="btn grow" onclick="closeSheet();editVehicle(null)">Vehicle</button>
   </div>`);
};

/* ============================ NATIVE BT STATUS ============================ */
// Called by the Kotlin bridge when the car Bluetooth connects / disconnects
window.nativeBtStatus = function(connected, deviceName) {
  BT_CONNECTED = !!connected;
  BT_DEVICE_NAME = deviceName || '';
  // Update header badge without a full re-render
  const due = allDue().filter(x=>x.state==='over').length;
  const btBadge = BT_CONNECTED
    ? `<span class="pill" style="--c:var(--ok);margin-right:4px"><svg viewBox="0 0 24 24" style="width:10px;height:10px;stroke:currentColor;fill:none;stroke-width:2;display:inline-block;vertical-align:middle;margin-right:3px"><path d="m7 7 10 5-5 5V3l5 5L7 17"/></svg>BT</span>`
    : '';
  const el = document.getElementById('topRight');
  if (el) el.innerHTML = (VIEW==='due'&&due) ? btBadge+`<span class="pill st-over">${due} overdue</span>` : btBadge;
  if (connected) toast('🔵 Car connected — ' + (deviceName||'Bluetooth device'));
};
window.nativeBtStatus = window.nativeBtStatus;

/* ============================ BOOT ============================ */
(async function(){
  await load();
  if(DB.settings.firstRun){DB.settings.firstRun=0;save()}
  render();
  checkNotify(false);
  document.addEventListener('visibilitychange',()=>{
    if(!document.hidden){
      if(TRIP.on&&!TRIP.wake&&'wakeLock' in navigator){
        navigator.wakeLock.request('screen').then(w=>{TRIP.wake=w}).catch(()=>{})}
      if(TRIP.on)paintDrive();
      else if(VIEW!=='ask')render();
      checkNotify(false);
    }
  });
  window.addEventListener('beforeunload',e=>{if(TRIP.on){e.preventDefault();e.returnValue=''}});
  if('serviceWorker' in navigator&&location.protocol.startsWith('http')){try{navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}}
})();
