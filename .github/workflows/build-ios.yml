name: Build iOS IPA

on:
  push:
    branches: [ main ]
    paths:
      - 'garajku-ios/**'
      - 'shared/index.html'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy shared index.html into iOS bundle
        run: cp shared/index.html garajku-ios/garajku-ios/index.html

      - name: Select Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Build unsigned IPA
        run: |
          xcodebuild \
            -project garajku-ios/garajku-ios.xcodeproj \
            -scheme garajku-ios \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CONFIGURATION_BUILD_DIR=$PWD/build \
            clean build
          mkdir -p build/Payload
          cp -r build/garajku-ios.app build/Payload/
          cd build && zip -r ../garajku-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: garajku-ios-unsigned
          path: garajku-unsigned.ipa
          retention-days: 30